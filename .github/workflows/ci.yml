name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Dogfooding: every PR runs the demo agent's suite at the base commit and at the PR head,
  # comments the diff, and fails if a case regresses. The agent runs on the keyless simulated
  # model and the judge replays recorded fixtures (criteria without one are skipped), so no
  # API key is needed.
  agent-eval:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      SIM_LATENCY: "0.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          suite: examples/support_agent/suite.yaml
          repeats: "3"
          max-regressions: "0"
          max-pass-rate-drop: "0.05"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t tracejudge .
      - name: Smoke test
        run: |
          docker run -d --name tj -p 7600:7600 tracejudge
          for i in $(seq 30); do curl -sf localhost:7600/api/runs > runs.json && break; sleep 1; done
          python3 -c "import json; runs = json.load(open('runs.json')); assert len(runs) == 4, runs"
          curl -sf localhost:7600/ | grep -q '<div id="root">'
