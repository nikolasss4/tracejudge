[project]
name = "tracejudge"
version = "0.1.0"
description = "Evals and trace viewer for tool-calling agents: catch regressions before your users do."
readme = "README.md"
license = "MIT"
authors = [{ name = "nikolasss4" }]
requires-python = ">=3.12"
keywords = ["llm", "evals", "agents", "observability", "opentelemetry", "llm-as-judge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.3"]
otlp = ["opentelemetry-proto>=1.27"]

[project.urls]
Homepage = "https://github.com/nikolasss4/tracejudge"
Issues = "https://github.com/nikolasss4/tracejudge/issues"

[project.scripts]
tracejudge = "tracejudge.cli:app"

[dependency-groups]
dev = [
    "anthropic>=2.3",
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-common>=1.27",
    "opentelemetry-proto>=1.27",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP047"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["src/tracejudge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
